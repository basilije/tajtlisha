appId: com.blonestar.tajtlisha
productName: Tajtlisha
copyright: Copyright © 2026 Bojan
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - '!out/**/*.map'
  - package.json
asar: true
extraFiles:
  - from: build/opus.key.example
    to: opus.key.example
artifactName: ${productName}-${version}-${arch}.${ext}
publish:
  provider: github
  owner: blonestar
  repo: tajtlisha
  releaseType: release
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: AudioVideo
  synopsis: Subtitles for short MP4 clips
  description: |
    Tajtlisha creates, translates and edits subtitles for short MP4 clips, then exports
    SRT files or an MP4 with burned-in subtitles. FFmpeg is bundled with the application.
  maintainer: Bojan <5240133+blonestar@users.noreply.github.com>
  vendor: Bojan
  # Bundled ffmpeg from `node scripts/fetch-ffmpeg.mjs` (vendor/README.md) -> resources/ffmpeg, which
  # src/main/ffmpeg/paths.ts searches. Linux also needs resources/lib for the RPATH $ORIGIN/../lib.
  # A platform-level extraResources replaces the top-level one, so the fonts entry is repeated per platform.
  extraResources:
    - from: resources/fonts
      to: fonts
    - from: vendor/ffmpeg/linux-x64/bin
      to: ffmpeg
    - from: vendor/ffmpeg/linux-x64/lib
      to: lib
    - from: vendor/ffmpeg/linux-x64/LICENSE.txt
      to: ffmpeg/LICENSE.txt
    - from: vendor/ffmpeg/linux-x64/SOURCE.txt
      to: ffmpeg/SOURCE.txt
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  extraResources:
    - from: resources/fonts
      to: fonts
    - from: vendor/ffmpeg/win32-x64/bin
      to: ffmpeg
    - from: vendor/ffmpeg/win32-x64/LICENSE.txt
      to: ffmpeg/LICENSE.txt
    - from: vendor/ffmpeg/win32-x64/SOURCE.txt
      to: ffmpeg/SOURCE.txt
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Tajtlisha
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
