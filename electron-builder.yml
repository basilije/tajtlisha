appId: com.blonestar.tajtlisha
productName: Tajtlisha
copyright: Copyright © 2026 Bojan
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - '!out/**/*.map'
  - package.json
asar: true
extraResources:
  - from: resources/fonts
    to: fonts
artifactName: ${productName}-${version}-${arch}.${ext}
publish:
  provider: github
  owner: blonestar
  repo: tajtlisha
  releaseType: release
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: AudioVideo
  synopsis: Subtitles for short MP4 clips
  description: |
    Tajtlisha creates, translates and edits subtitles for short MP4 clips, then exports
    SRT files or an MP4 with burned-in subtitles. Requires ffmpeg on the system PATH.
  maintainer: Bojan <5240133+blonestar@users.noreply.github.com>
  vendor: Bojan
deb:
  depends:
    - ffmpeg
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
